---
layout: default
title: Теории
---

<h2>Теории</h2>
<ul class="post-list">
  {% for post in site.categories.theory %}
    <li>
<!--      <span class="post-meta">{{ post.date | date: "%b %d, %Y" }}</span>-->
      <h3>
        <a class="post-link" href="{{ post.url | relative_url }}">
          {{ post.title | escape }}
        </a>
      </h3>
      {% if site.show_excerpts %}
        {{ post.excerpt }}
      {% endif %}
    </li>
  {% endfor %}
</ul>
